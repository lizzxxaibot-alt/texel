<!doctype html><meta charset="utf-8">
<title>Texel - pixel perfect</title>
<!--
  One frame of the pixel-perfect GIF. shoot_gif.mjs loads this once and calls
  setFrame(n) between screenshots, so the fonts and layout are paid for once.

  Every texel position comes from gif/stroke.json, which gif_stroke.py builds by
  replaying core.raster.PerfectStroke - the shipped object. Nothing here knows
  how the filter works.

  Geometry is deliberately all integers: 12 CSS px per texel, rendered at 2x and
  box-downsampled by exactly half, so a texel stays a hard-edged square while
  the type still gets supersampled.
-->
<style>
  @font-face{font-family:'YoungSerif';src:url('../../../../brand/fonts/YoungSerif-Regular.ttf') format('truetype')}
  @font-face{font-family:'Inter';src:url('../../../../brand/fonts/Inter.ttf') format('truetype')}
  :root{
    --bg:#141317; --panel:#1e1d25; --line:rgba(242,230,200,.14);
    --text:#f2e6c8; --dim:#ab9f8a; --ember:#ff9c3f; --gold:#e7b23a;
    --bad:#e0563f;
    --tex:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:900px;height:560px;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
       -webkit-font-smoothing:antialiased}

  .frame{width:900px;height:560px;padding:30px 31px;display:flex;
         flex-direction:column;
         background:
           radial-gradient(900px 420px at 76% -12%,rgba(255,156,63,.10),transparent 62%),
           var(--bg)}

  /* ---------- head ---------- */
  .head{display:flex;align-items:flex-end;justify-content:space-between}
  .kicker{font-size:11px;letter-spacing:.17em;text-transform:uppercase;
          color:var(--gold);font-weight:600}
  h1{font-family:'YoungSerif',Georgia,serif;font-size:31px;line-height:1.12;
     margin-top:9px;font-weight:400}
  h1 em{font-style:normal;color:var(--ember)}
  .meta{text-align:right;font-size:12px;color:var(--dim);line-height:1.75}
  .meta b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

  /* ---------- rows ---------- */
  .rows{margin-top:26px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;align-items:center;gap:18px}
  .lab{width:124px;text-align:right;flex:none}
  .labname{font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--dim)}
  .labname i{font-style:normal;display:block;font-size:10px;letter-spacing:.15em;
             text-transform:uppercase;margin-top:3px;color:var(--dim);opacity:.72}
  .row.on .labname{color:var(--text)}
  .row.on .labname i{color:var(--ember);opacity:1}
  .labstat{margin-top:9px;font-size:11.5px;color:var(--dim);line-height:1.35}
  .labstat b{display:block;font-size:19px;font-weight:600;color:var(--dim);
             font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .row.off .labstat b{color:var(--bad)}
  .row.on  .labstat b{color:var(--gold)}

  /* ---------- canvas ---------- */
  .cv{position:relative;width:696px;height:168px;flex:none;
      border:1px solid var(--line);
      background-color:#191820;
      background-image:
        linear-gradient(45deg,#1d1c24 25%,transparent 25%,transparent 75%,#1d1c24 75%),
        linear-gradient(45deg,#1d1c24 25%,transparent 25%,transparent 75%,#1d1c24 75%);
      background-size:24px 24px;
      background-position:0 0,12px 12px;
      box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 24px rgba(0,0,0,.35)}
  .cv::after{content:'';position:absolute;inset:0;pointer-events:none;
     background-image:
       repeating-linear-gradient(to right,rgba(242,230,200,.055) 0 1px,transparent 1px 12px),
       repeating-linear-gradient(to bottom,rgba(242,230,200,.055) 0 1px,transparent 1px 12px)}
  .row.on.done .cv{border-color:rgba(255,156,63,.55)}

  .t{position:absolute;width:12px;height:12px;background:var(--text)}
  .t.bad{background:var(--bad)}
  .cur{position:absolute;width:12px;height:12px;z-index:3;
       box-shadow:0 0 0 2px var(--ember), 0 0 12px 3px rgba(255,156,63,.42)}

  /* ---------- foot ---------- */
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
        font-size:12.5px;color:var(--dim)}
  .foot b{color:var(--text);font-weight:600}
  .foot .url{font-size:11px;letter-spacing:.1em;text-transform:uppercase;
             color:var(--dim);opacity:.72}
</style>

<div class="frame">
  <div class="head">
    <div>
      <div class="kicker">Texel &middot; Pixel Perfect</div>
      <h1>Same drag. <em>No joints to fix.</em></h1>
    </div>
    <div class="meta">
      <div><b id="mEv">0</b> mouse events</div>
      <div><b id="mTx">0</b> texels crossed</div>
    </div>
  </div>

  <div class="rows">
    <div class="row off" id="rOff">
      <div class="lab">
        <div class="labname">Pixel Perfect<i>off</i></div>
        <div class="labstat"><b id="nOff">0</b>joints to fix</div>
      </div>
      <div class="cv" id="cOff"></div>
    </div>
    <div class="row on" id="rOn">
      <div class="lab">
        <div class="labname">Pixel Perfect<i>on &middot; default</i></div>
        <div class="labstat"><b id="nOn">0</b>joints to fix</div>
      </div>
      <div class="cv" id="cOn"></div>
    </div>
  </div>

  <div class="foot">
    <div>Freehand strokes are filtered <b>while you draw them</b> &mdash; not cleaned up afterwards.</div>
    <div class="url">mintworks.cc/texel</div>
  </div>
</div>

<script>
const T = 12;
let D = null, LEAD = 6, TAIL = 8;

async function boot(){
  // the shooter injects __DATA (file:// forbids fetch); a plain browser fetches
  D = window.__DATA || await (await fetch('stroke.json')).json();
  window.TOTAL = LEAD + D.frames + TAIL;
  document.getElementById('mEv').textContent = D.events;
  setFrame(0);
  window.__ready = true;
}

function paint(el, pts, bad){
  const b = bad ? new Set(bad.map(p => p[0] + ',' + p[1])) : null;
  let html = '';
  for (const [x, y] of pts){
    const k = b && b.has(x + ',' + y) ? 't bad' : 't';
    html += `<div class="${k}" style="left:${x*T}px;top:${y*T}px"></div>`;
  }
  el.innerHTML = html;
  return el;
}

function setFrame(f){
  const drawing = f >= LEAD && f < LEAD + D.frames;
  const done    = f >= LEAD + D.frames;
  const step    = drawing ? f - LEAD : (done ? D.frames - 1 : -1);

  const off = step < 0 ? [] : D.off[step];
  const on  = step < 0 ? [] : D.on[step];
  const bad = step < 0 ? [] : D.corner_steps[step];

  paint(document.getElementById('cOff'), off, bad);
  paint(document.getElementById('cOn'),  on,  null);

  // cursor sits on the texel the mouse is over, on both canvases, and lifts
  // when the button comes up. During the drag ON trails it by one texel - that
  // is the feature, not a rendering slip: the last point stays provisional
  // until the next event proves it is not a corner.
  if (!done && step < D.lift){
    const c = D.cursor[Math.max(step, 0)];
    for (const id of ['cOff','cOn']){
      const d = document.createElement('div');
      d.className = 'cur';
      d.style.left = (c[0]*T) + 'px';
      d.style.top  = (c[1]*T) + 'px';
      document.getElementById(id).appendChild(d);
    }
  }

  document.getElementById('nOff').textContent = bad.length;
  document.getElementById('nOn').textContent  = 0;
  document.getElementById('mTx').textContent  = off.length;
  document.getElementById('rOn').classList.toggle('done', done);
}
boot();
</script>
